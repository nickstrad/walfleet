name: sqlite-internals

services:
  lab:
    build:
      context: .
      dockerfile: Dockerfile.lab
    image: sqlite-internals-lab:local
    cap_add:
      - SYS_PTRACE
    working_dir: /src
    environment:
      COURSE_WORK_DIR: /work
      COURSE_LAB: "1"
      GOCACHE: /go/build-cache
      COURSE_S3_ENDPOINT: http://seaweedfs:8333
      COURSE_S3_REGION: us-east-1
      COURSE_S3_ACCESS_KEY: course
      COURSE_S3_SECRET_KEY: course-secret
    volumes:
      - .:/src
      - lab-work:/work
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go/build-cache

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=64
      - -volume.max=100
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${COURSE_S3_HOST_PORT:-18333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  lab-work:
  go-mod-cache:
  go-build-cache:
  seaweedfs-data:
